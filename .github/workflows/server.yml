name: Server

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Smoke test (server + 2 clients)
        run: ./tests/smoke-test.sh
      - name: Publish Windows server and test client
        run: |
          dotnet publish src/Server -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
          dotnet publish src/TestClient -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
          cp scripts/start-server.bat scripts/test-client.bat publish/
          rm -f publish/*.pdb
      - uses: actions/upload-artifact@v4
        with:
          name: TradeServer-windows
          path: publish/
